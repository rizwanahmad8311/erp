# Development only, on macOS. Production is a single Windows PC with no Docker.
# One service. No Postgres, no Redis, no nginx — SQLite is the database.

# Without this the project name is taken from this file's directory ("docker"),
# which would name the data volume docker_erp-data.
name: erp

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp-web
    ports:
      - "8000:8000"
    volumes:
      # Source bind-mounted from the Mac: edits are live, no rebuild.
      - ..:/app
      # SQLite lives on a named volume, not the bind mount. macOS bind mounts
      # do not give SQLite reliable file locking, which corrupts WAL databases.
      - erp-data:/app/data
      # Keep container-built artefacts out of the host tree.
      - erp-venv-cache:/root/.cache
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  erp-data:
  erp-venv-cache:
